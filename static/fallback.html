<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Unreachable</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0f14;
    color: #c8cfe0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 360px;
  }
  .icon {
    font-size: 40px;
    margin-bottom: 12px;
  }
  h1 {
    color: #e8edf8;
    font-size: 18px;
    margin: 0 0 8px;
  }
  p {
    color: #5a6480;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 20px;
  }
  a.watchdog-link {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 6px;
    background: rgba(61,142,240,.12);
    color: #3d8ef0;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid #2a3045;
  }
  a.watchdog-link:hover {
    background: rgba(61,142,240,.2);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Dashboard Unreachable</h1>
    <p>The TravelNet backend isn't responding right now. Try again shortly, or check the Watchdog for status.</p>
    <a class="watchdog-link" href="http://watchdog.tail186ff8.ts.net:9001" target="_blank" rel="noopener noreferrer">
      🐕 Open Watchdog
    </a>
  </div>
</body>
</html>
